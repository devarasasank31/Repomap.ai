spring:
  application:
    name: repomap
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repomap}
    username: ${DB_USERNAME:repomap}
    password: ${DB_PASSWORD:repomap}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      pool-name: repomap-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 110MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

repomap:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  storage:
    root: ${REPOMAP_STORAGE_ROOT:${user.home}/.repomap/projects}
  limits:
    max-upload-bytes: ${MAX_UPLOAD_BYTES:104857600}
    max-extracted-files: ${MAX_EXTRACTED_FILES:20000}
    max-extracted-bytes: ${MAX_EXTRACTED_BYTES:524288000}
    max-single-file-bytes: ${MAX_SINGLE_FILE_BYTES:5242880}
    max-compression-ratio: ${MAX_COMPRESSION_RATIO:200}
  security:
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:24}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:24000}

logging:
  level:
    root: INFO
    com.repomap: INFO
