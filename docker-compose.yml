services:
  postgres:
    image: postgres:16-alpine
    container_name: repomap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repomap
      POSTGRES_USER: repomap
      POSTGRES_PASSWORD: repomap
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repomap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomap -d repomap"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  repomap-pgdata:
